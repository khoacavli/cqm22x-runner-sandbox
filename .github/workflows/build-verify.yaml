name: 🔬 Build Verify

# Same defaults as Build Release (a plain "Run workflow" reproduces the release
# config exactly) plus two things Build Release doesn't have:
#   - any of the 6 revision inputs can be pointed at a dev/test branch to try
#     it before it's "release" material
#   - cherry_pick_sha: give it a single commit SHA and it auto-detects which
#     of the 6 projects that commit belongs to, then cherry-picks it onto
#     that project's checkout (local to the runner, never pushed anywhere) --
#     for testing "does this one commit still build cleanly on top of the
#     release branch" without creating a throwaway branch by hand first.
# Never publishes to Google Drive (see _build-common.yaml's publish_release
# input) -- test builds shouldn't clutter the shared release folder.
on:
  workflow_dispatch:
    inputs:
      profile_build:
        description: 'PROFILE_BUILD override (blank = use meta_release.txt)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - MBB-CAV
          - MBB
          - M2-CAV
          - M2
      software_version:
        description: 'SOFTWARE_VERSION override (blank = use meta_release.txt)'
        required: false
        type: string
      modem_version:
        description: 'MODEM_VERSION override (blank = use meta_release.txt)'
        required: false
        type: string
      release_tag:
        description: 'RELEASE_TAG override -- cqm22x-manifests tag/branch (blank = use meta_release.txt)'
        required: false
        type: string
      app_proc_revision:
        description: 'cqm22x-apps-proc revision (default = release branch; point at a dev branch to test it)'
        required: false
        type: string
        default: 'cavli_sdx35_iot_le_1_0'
      modem_proc_revision:
        description: 'cqm22x-modem-proc revision (default = release branch)'
        required: false
        type: string
        default: 'cavli_sdx35_iot_le_1_0_r00035.1_1.164485.2'
      chipcode_revision:
        description: 'cqm22x-chipcode revision (default = release branch)'
        required: false
        type: string
        default: 'cavli_sdx35_iot_le_1_0'
      build_scripts_revision:
        description: 'cqm22x-build-scripts revision (default = release branch)'
        required: false
        type: string
        default: 'cavli_sdx35_iot_le_1_0'
      cavli_services_revision:
        description: 'cavli_linux_services revision (default = release branch)'
        required: false
        type: string
        default: 'main'
      cavli_sdk_revision:
        description: 'cavli_sdk_tools_linux revision (blank = keep manifest''s pinned commit)'
        required: false
        type: string
        default: ''
      cherry_pick_sha:
        description: 'Commit SHA to cherry-pick onto its release branch (blank = skip). Just the SHA -- which of the 6 repos it belongs to is auto-detected.'
        required: false
        type: string
        default: ''

jobs:
  build:
    uses: ./.github/workflows/_build-common.yaml
    secrets: inherit
    with:
      profile_build: ${{ inputs.profile_build }}
      software_version: ${{ inputs.software_version }}
      modem_version: ${{ inputs.modem_version }}
      release_tag: ${{ inputs.release_tag }}
      app_proc_revision: ${{ inputs.app_proc_revision }}
      modem_proc_revision: ${{ inputs.modem_proc_revision }}
      chipcode_revision: ${{ inputs.chipcode_revision }}
      build_scripts_revision: ${{ inputs.build_scripts_revision }}
      cavli_services_revision: ${{ inputs.cavli_services_revision }}
      cavli_sdk_revision: ${{ inputs.cavli_sdk_revision }}
      cherry_pick_sha: ${{ inputs.cherry_pick_sha }}
      publish_release: false
