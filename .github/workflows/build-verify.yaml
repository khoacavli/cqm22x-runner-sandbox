name: Build Verify

# Same as Build Release (same fixed release branches, same everything) except
# one thing: cherry_pick_sha. Give it one or more commit SHAs (comma and/or
# newline-separated) and it auto-detects which of the 6 projects each commit
# belongs to, then cherry-picks them onto their respective project checkouts
# (local to the runner, never pushed anywhere), in the order given -- for
# testing "do these commits still build cleanly on top of the release branch"
# without creating a throwaway branch by hand first. Multiple commits landing
# on the same project apply in order (matters if a later one depends on an
# earlier one).
#
# Everything else that Build Release exposes as a UI input (profile/version/
# tag overrides, per-project revision overrides) is intentionally NOT here --
# kept fixed to the same release defaults under the hood. Trim this down
# further, or add specific overrides back, as actual need comes up.
on:
  workflow_dispatch:
    inputs:
      cherry_pick_sha:
        description: 'Commit SHA(s) to cherry-pick onto their release branch, comma/newline-separated. Just the SHAs -- which repo each belongs to is auto-detected.'
        required: false
        type: string
        default: ''
      run_hw_test:
        description: 'Flash the built image onto the test rig board and confirm it boots (adb) -- off by default'
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/_build-common.yaml
    secrets: inherit
    with:
      app_proc_revision: 'cavli_sdx35_iot_le_1_0'
      modem_proc_revision: 'cavli_sdx35_iot_le_1_0_r00035.1_1.164485.2'
      chipcode_revision: 'cavli_sdx35_iot_le_1_0'
      build_scripts_revision: 'cavli_sdx35_iot_le_1_0'
      cavli_services_revision: 'main'
      cherry_pick_sha: ${{ inputs.cherry_pick_sha }}
      publish_release: true
      run_hw_test: ${{ inputs.run_hw_test }}
