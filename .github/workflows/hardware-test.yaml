name: Hardware Test

# Standalone, build-free pipeline: grabs whichever binaries archive is most
# recently modified in the shared Drive folder that both Build Release and
# Build Verify publish to (Cavli-Team/share/khoa/test -- no distinction made
# between the two; "latest" is purely by Drive ModTime) and runs just the
# flash + boot check against the test rig board. For re-testing hardware
# without waiting through a full ~15-20min build again -- e.g. after fixing
# something on the rig itself, swapping the board, or re-running a flaky
# hardware pass on a build that already exists.
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level to run (cumulative -- see cqm22x-docs automation/README.adoc)'
        required: false
        type: choice
        default: 'basic'
        options:
          - basic
          - full
          - night

jobs:
  hw-test:
    runs-on: [self-hosted, cqm22x-test-runner]
    timeout-minutes: 25
    steps:
      # Step 1: figure out which binaries archive to test, and pull it plus
      # flash_2k.sh + flash_4k.sh (same files the build pipeline generates --
      # static content, so whatever copies are currently sitting in the
      # shared Drive folder are fine to reuse) down to this runner. Which
      # flash script actually gets run is decided later, from the board's
      # own reported NAND page size.
      - name: Find Latest Release Binaries
        run: |
          RCLONE_BIN=/usr/bin/rclone
          RCLONE_CONF=/home/user/share_data/rclone-cli/Cavli-Team.conf
          DRIVE_DIR="Cavli-Team/share/khoa/test"

          LATEST=$("$RCLONE_BIN" --config "$RCLONE_CONF" lsjson "GGDrive:/$DRIVE_DIR" 2>/dev/null | python3 -c "
          import json, sys
          items = json.load(sys.stdin)
          cands = [i for i in items if i['Name'].startswith('Kuno.LEI.1.0_SDX35_') and i['Name'].endswith('_binaries.tar.gz')]
          if not cands:
              sys.exit(1)
          cands.sort(key=lambda i: i['ModTime'], reverse=True)
          print(cands[0]['Name'])
          ")
          if [ -z "$LATEST" ]; then
            echo "No release binaries archive found in Drive:/$DRIVE_DIR -- has a build ever published here?"
            exit 1
          fi
          echo "Latest binaries archive on Drive: $LATEST"

          "$RCLONE_BIN" --config "$RCLONE_CONF" copy "GGDrive:/$DRIVE_DIR/$LATEST" . --progress
          "$RCLONE_BIN" --config "$RCLONE_CONF" copy "GGDrive:/$DRIVE_DIR/flash_2k.sh" . 2>/dev/null
          "$RCLONE_BIN" --config "$RCLONE_CONF" copy "GGDrive:/$DRIVE_DIR/flash_4k.sh" . 2>/dev/null
          if [ ! -f "$LATEST" ] || [ ! -f flash_2k.sh ] || [ ! -f flash_4k.sh ]; then
            echo "Could not fetch $LATEST / flash_2k.sh / flash_4k.sh from Drive:/$DRIVE_DIR"
            exit 1
          fi
          chmod +x flash_2k.sh flash_4k.sh

          echo "BINARIES_NAME=$LATEST" >> $GITHUB_ENV

      # Step 2: same self-healing Tailscale check as the build pipeline's hw
      # test step -- see _build-common.yaml for why this runner needs it
      # (userspace-networking mode, no systemd to keep tailscaled alive).
      - name: Ensure Tailscale Connectivity
        timeout-minutes: 3
        run: |
          if ssh -o ConnectTimeout=8 -o BatchMode=yes pi 'echo ok' >/dev/null 2>&1; then
            echo "Tailscale link to test rig OK"
          else
            echo "SSH to test rig failed -- restarting tailscaled on this runner"
            sudo pkill -f tailscaled 2>/dev/null || true
            sleep 2
            sudo mkdir -p /var/lib/tailscale /run/tailscale
            sudo nohup tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1056 > /tmp/tailscaled.log 2>&1 &
            disown
            sleep 5
            sudo tailscale --socket=/run/tailscale/tailscaled.sock up --hostname=cicd-sdx-jammy-runner --accept-dns=false
            sleep 3
            ssh -o ConnectTimeout=10 -o BatchMode=yes pi 'echo ok' || { echo "Still cannot reach test rig -- failing hw test"; exit 1; }
            echo "Tailscale link recovered"
          fi

      # Step 3: all test *logic* (which test cases exist, what level each is
      # tagged, pass/fail criteria) lives in cqm22x-docs, not here -- see
      # automation/run_tests.py and automation/README.adoc there. This step
      # is just infra plumbing: get the whole docs repo onto the rig (not
      # just automation/ -- run_tests.py also needs scripts/lib_testcases.py
      # and testcases/cases/*.adoc to resolve each script's level) and run
      # it. Anyone can run the exact same command locally against the rig.
      - name: Fetch Test Automation (cqm22x-docs)
        timeout-minutes: 3
        run: |
          DOCS_CHECKOUT=$(mktemp -d)
          git clone --depth 1 git@github.com:cavli-wireless/cqm22x-docs.git "$DOCS_CHECKOUT"
          echo "DOCS_CHECKOUT=$DOCS_CHECKOUT" >> $GITHUB_ENV

      # Step 4: same flash + boot check as the build pipeline's hw test step,
      # except the binaries archive is pulled straight from Drive on the rig
      # side (BINARIES_DL_LINK, from step 1) instead of being freshly
      # uploaded from a local build -- there's no local build in this
      # pipeline to upload from.
      - name: Hardware Test (run_tests.py)
        timeout-minutes: 20
        run: |
          LEVEL="${{ inputs.level }}"
          RCLONE="rclone --config $HOME/rclone_fw_share.conf"
          DRIVE_RUN_PATH="share/khoa/hwtest-ci/run-${{ github.run_id }}"

          # Everything crosses the Tailscale link via Drive, not scp -- this
          # runner and the rig both have plain internet and rclone (with the
          # same GGDrive: remote config on both sides), while the Tailscale
          # hop is relayed through DERP (no direct UDP path out of this
          # sandbox) and scp over it is slow even for small files.
          echo "Uploading binaries + flash scripts + test automation to Drive ($DRIVE_RUN_PATH)..."
          $RCLONE copy "$BINARIES_NAME" "GGDrive:/$DRIVE_RUN_PATH" --progress
          $RCLONE copy flash_2k.sh "GGDrive:/$DRIVE_RUN_PATH" --progress
          $RCLONE copy flash_4k.sh "GGDrive:/$DRIVE_RUN_PATH" --progress
          $RCLONE copy "${{ env.DOCS_CHECKOUT }}" "GGDrive:/$DRIVE_RUN_PATH/docs" --progress

          echo "Running automation/run_tests.py --level $LEVEL on test rig (flock-serialized -- waits its turn if another job is using the board)..."
          set +e
          ssh pi "flock -w 1200 ~/hwtest/board.lock bash -s" > hw_test_output.log 2>&1 <<REMOTE_EOF
          set -e
          RCLONE="rclone --config \$HOME/rclone_fw_share.conf"
          rm -rf ~/hwtest_run
          mkdir -p ~/hwtest_run
          cd ~/hwtest_run
          \$RCLONE copy "GGDrive:/$DRIVE_RUN_PATH" .
          tar xzf "$BINARIES_NAME"
          # rclone/Drive doesn't preserve the executable bit (Drive isn't a
          # POSIX filesystem) -- restore it after download, unlike scp which
          # used to carry it over automatically.
          chmod +x flash_2k.sh flash_4k.sh
          # Capture run_tests.py's exit code instead of letting it FAIL
          # under set -e -- otherwise a failing test skips the evidence
          # upload below entirely, which is exactly the case debugging
          # needs it most.
          set +e
          python3 docs/automation/run_tests.py --level $LEVEL --evidence-dir test_evidence
          TEST_EXIT=\$?
          set -e
          \$RCLONE copy test_evidence "GGDrive:/$DRIVE_RUN_PATH/test_evidence"
          exit \$TEST_EXIT
          REMOTE_EOF
          REMOTE_EXIT=$?
          set -e

          cat hw_test_output.log

          echo "Pulling test evidence back from Drive..."
          rm -rf hw_test_evidence
          if $RCLONE copy "GGDrive:/$DRIVE_RUN_PATH/test_evidence" hw_test_evidence --progress; then
            echo "Evidence pulled to hw_test_evidence/"
          else
            echo "Could not pull evidence dir (test run may have failed before it was written)"
          fi

          ssh pi "rm -rf ~/hwtest_run" || true
          rm -rf "${{ env.DOCS_CHECKOUT }}"
          $RCLONE purge "GGDrive:/$DRIVE_RUN_PATH" 2>&1 || true

          # run_tests.py's own exit code convention: 0 only if every selected
          # test PASSED, 1 otherwise -- which test and why is in
          # hw_test_evidence/*.log and results.json, both uploaded next.
          if [ $REMOTE_EXIT -eq 0 ]; then
            echo "Hardware test level=$LEVEL PASSED"
            echo "HW_TEST_RESULT=PASS" >> $GITHUB_ENV
          else
            echo "Hardware test level=$LEVEL FAILED -- see log above / hw_test_evidence artifact"
            echo "HW_TEST_RESULT=FAIL" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload Test Evidence
        if: always()
        id: upload_test_evidence
        uses: actions/upload-artifact@v4
        with:
          name: hw-test-evidence-${{ github.run_id }}
          path: hw_test_evidence/
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish Result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          RESULT="${{ env.HW_TEST_RESULT || 'FAIL (did not reach test step)' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EVIDENCE_ARTIFACT_ID="${{ steps.upload_test_evidence.outputs.artifact-id }}"
          EVIDENCE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${EVIDENCE_ARTIFACT_ID}"

          {
            echo "# Hardware Test Results"
            echo ""
            echo "Status: $STATUS"
            echo "Level: ${{ inputs.level }}"
            echo "Binaries tested: ${{ env.BINARIES_NAME }}"
            echo "Result: $RESULT"
            if [ -n "$EVIDENCE_ARTIFACT_ID" ]; then
              echo ""
              echo "Test evidence: [download]($EVIDENCE_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          WEBHOOK="${{ secrets.SLACK_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL secret not set -- skipping Slack notification"
            exit 0
          fi

          TEXT="*Hardware Test* (level=${{ inputs.level }}) -- $STATUS
          <$RUN_URL|View run> -- triggered by ${{ github.actor }}
          Binaries tested: ${{ env.BINARIES_NAME }}
          Result: $RESULT"
          if [ -n "$EVIDENCE_ARTIFACT_ID" ]; then
            TEXT="$TEXT
          Test evidence: <$EVIDENCE_URL|download>"
          fi

          PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'text': sys.argv[1]}))" "$TEXT")
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Slack notification sent"
          else
            echo "Slack notification failed (HTTP $HTTP_CODE) -- not failing over this"
          fi
