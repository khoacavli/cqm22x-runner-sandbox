name: Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: [self-hosted, cqm22x-test-runner]
    steps:
      - name: Report runner identity
        run: |
          echo "Hostname: $(hostname)"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner labels used: self-hosted, cqm22x-test-runner"
          echo "Triggered by: ${{ github.actor }}"
          date
      - name: Success
        run: echo "OK - self-triggered run reached the correct self-hosted runner"
