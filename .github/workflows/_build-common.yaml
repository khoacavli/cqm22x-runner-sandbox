name: _build-common (reusable)

# Shared build logic for both build-release.yaml and build-verify.yaml -- neither of
# those is dispatchable directly (workflow_call only shows up as "used by" another
# workflow, not in the Actions "Run workflow" list). Edit build logic here once; both
# callers pick it up automatically. Caller-specific behavior (fixed vs UI-selectable
# revision defaults, cherry-pick, whether to publish to Google Drive) is all driven by
# the `inputs:` below -- this file has no opinion on which caller it's running under.
on:
  workflow_call:
    inputs:
      profile_build:
        type: string
        required: false
        default: ''
      software_version:
        type: string
        required: false
        default: ''
      modem_version:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      app_proc_revision:
        type: string
        required: false
        default: ''
      modem_proc_revision:
        type: string
        required: false
        default: ''
      chipcode_revision:
        type: string
        required: false
        default: ''
      build_scripts_revision:
        type: string
        required: false
        default: ''
      cavli_services_revision:
        type: string
        required: false
        default: ''
      cavli_sdk_revision:
        type: string
        required: false
        default: ''
      # Verify-only: a single commit SHA to cherry-pick onto whichever of the 6
      # projects it's actually found in (auto-detected -- see "Cherry-pick Verify
      # Commit" step), applied to that project's checkout AFTER repo sync, local-only,
      # never pushed anywhere. Blank = skip entirely (build-release always leaves this
      # blank; it's not exposed as an input there).
      cherry_pick_sha:
        type: string
        required: false
        default: ''
      # build-release sets this true (publish the finished package to Google Drive);
      # build-verify sets it false (test builds shouldn't clutter the shared Drive
      # folder with one-off artifacts).
      publish_release:
        type: boolean
        required: false
        default: true
      # Optional: after the release package is built, SSH to the hardware test
      # rig (Raspberry Pi "pi", reached over Tailscale -- see "Ensure Tailscale
      # Connectivity" step), fastboot-flash the board with this build's binaries,
      # reboot it, and confirm it comes back up as an adb device. Off by default
      # since not every build needs (or has a free board for) a hardware pass.
      run_hw_test:
        type: boolean
        required: false
        default: false

# No concurrency limit here anymore -- it used to serialize same-workflow/same-ref
# runs (see build-release.yaml, which still does this: only one "the" release build
# should be in flight at a time), but that also meant two Build Verify dispatches
# testing two unrelated changes queued behind each other instead of actually running
# in parallel on separate runners. Verify runs are inherently independent (different
# cherry-pick targets, different branches) so let them race freely.

# Environment variables
env:
  WORKSPACE_ROOT: ${{ github.workspace }}
  CHIPCODE_ROOT: ${{ github.workspace }}/chipcode
  BUILD_DATE: $(date +'%Y%m%d')
  APP_REPO:
  APP_BRANCH:
  MODEM_REPO:
  MODEM_BRANCH:
  CHIPCODE_REPO:
  CHIPCODE_BRANCH:
  BUILD_SCRIPT_REPO:
  BUILD_SCRIPT_BRANCH:
  CAVLI_SERVICES_REPO:
  CAVLI_SERVICES_BRANCH:
  CAVLI_SDK_REPO:
  CAVLI_SDK_BRANCH:
  SOFTWARE_VERSION:
  MODEM_VERSION:
  PROFILE_BUILD:

jobs:
  build-and-deploy-sdx35-3-qcom_refs:
    runs-on: [self-hosted, cqm22x-test-runner]

    steps:
    - name: Pull Meta Configuration
      run: |
        echo "Reading meta_release.txt configuration file..."
        cd ${{ env.WORKSPACE_ROOT }}

        # Pull the current repository to get meta_release.txt
        if [ ! -d ".git" ]; then
          echo "🔄 Cloning current repository for meta config..."
          # Clean any existing temp_repo directory first
          if [ -d "temp_repo" ]; then
            echo "🧹 Cleaning existing temp_repo directory..."
            rm -rf temp_repo
          fi
          CLONE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          echo "🔍 DEBUG - Clone URL: @github.com/${{ github.repository }}.git"
          git clone "$CLONE_URL" temp_repo
          cp temp_repo/meta_release.txt . 2>/dev/null || echo "⚠️ meta_release.txt not found, using workflow inputs"
          rm -rf temp_repo
        else
          echo "🔄 Updating current repository..."
          git pull origin main
        fi

        # Read configuration from meta_release.txt - REQUIRED
        if [ -f "meta_release.txt" ]; then
          echo "✅ Found meta_release.txt, reading configuration..."

          # Parse configuration file and set environment variables
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            [[ $key =~ ^#.*$ ]] && continue
            [[ -z $key ]] && continue

            # Remove any whitespace and export as environment variable
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)

            if [ -n "$key" ] && [ -n "$value" ]; then
              echo "📝 Setting $key=$value"
              # Set for GitHub ENV (next steps)
              echo "$key=$value" >> $GITHUB_ENV
              # Set for current step validation
              export "$key"="$value"
            fi
          done < meta_release.txt

          # Manual-trigger overrides: workflow_dispatch inputs win over meta_release.txt
          # when set, so a one-off test build (different profile/version/tag) doesn't
          # require editing + committing meta_release.txt first. Left blank = no change.
          echo ""
          echo "🎛️ Checking workflow_dispatch input overrides..."
          declare -A INPUT_OVERRIDES=(
            [PROFILE_BUILD]="${{ inputs.profile_build }}"
            [SOFTWARE_VERSION]="${{ inputs.software_version }}"
            [MODEM_VERSION]="${{ inputs.modem_version }}"
            [RELEASE_TAG]="${{ inputs.release_tag }}"
          )
          for key in "${!INPUT_OVERRIDES[@]}"; do
            value="${INPUT_OVERRIDES[$key]}"
            if [ -n "$value" ]; then
              echo "  🎛️ Overriding $key: ${!key:-<unset>} -> $value"
              echo "$key=$value" >> $GITHUB_ENV
              export "$key"="$value"
            fi
          done

          # Validate all required configuration parameters
          echo "🔍 Validating required configuration parameters..."

          MISSING_CONFIG=false

          # Check build configuration
          if [ -z "${PROFILE_BUILD:-}" ]; then
            echo "❌ PROFILE_BUILD is missing in meta_release.txt"
            MISSING_CONFIG=true
          fi

          # Check RELEASE_TAG - REQUIRED
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "❌ RELEASE_TAG is missing in meta_release.txt"
            MISSING_CONFIG=true
          fi

          # Check version information - REQUIRED
          if [ -z "${SOFTWARE_VERSION:-}" ]; then
            echo "❌ SOFTWARE_VERSION is missing in meta_release.txt"
            MISSING_CONFIG=true
          fi
          if [ -z "${MODEM_VERSION:-}" ]; then
            echo "❌ MODEM_VERSION is missing in meta_release.txt"
            MISSING_CONFIG=true
          fi

          # Fail if any required config is missing
          if [ "$MISSING_CONFIG" = "true" ]; then
            echo ""
            echo "💥 CRITICAL ERROR: Required configuration parameters are missing!"
            echo "❌ Please update meta_release.txt with all required parameters"
            echo "📋 Required parameters:"
            echo "   - Repository URLs: APP_REPO, MODEM_REPO, CHIPCODE_REPO, BUILD_SCRIPT_REPO, CAVLI_SERVICES_REPO, CAVLI_SDK_REPO"
            echo "   - Repository Branches: APP_BRANCH, MODEM_BRANCH, CHIPCODE_BRANCH, BUILD_SCRIPT_BRANCH, CAVLI_SERVICES_BRANCH, CAVLI_SDK_BRANCH"
            echo "   - Build Configuration: PROFILE_BUILD"
            echo "   - Version Information: SOFTWARE_VERSION, MODEM_VERSION"
            exit 1
          fi

          echo ""
          echo "📊 Configuration Summary from meta_release.txt:"
          echo "🔧 Repository Branches:"
          echo "  - Apps Proc: ${APP_BRANCH}"
          echo "  - Modem Proc: ${MODEM_BRANCH}"
          echo "  - Chipcode: ${CHIPCODE_BRANCH}"
          echo "  - Build Scripts: ${BUILD_SCRIPT_BRANCH}"
          echo "  - Cavli Services: ${CAVLI_SERVICES_BRANCH}"
          echo "  - Cavli SDK: ${CAVLI_SDK_BRANCH}"
          echo ""
          echo "📋 Version Information:"
          echo "  - Software Version: ${SOFTWARE_VERSION}"
          echo "  - Modem Version: ${MODEM_VERSION}"
          echo "  - Build Profile: ${PROFILE_BUILD}"
          echo "  - Release Tag: ${RELEASE_TAG:-'Not set'}"
          echo ""
          echo "✅ All required configuration loaded from meta_release.txt"
          echo "META_CONFIG_LOADED=true" >> $GITHUB_ENV
        else
          echo "💥 CRITICAL ERROR: meta_release.txt not found!"
          echo "❌ This workflow requires meta_release.txt file with all configuration parameters"
          echo "📋 Please create meta_release.txt in the repository root with the following format:"
          echo ""
          echo "# Repository URLs and Branches"
          echo "APP_REPO=git@github.com:cavli-wireless/cqm22x-apps-proc.git"
          echo "APP_BRANCH=main"
          echo "MODEM_REPO=git@github.com:cavli-wireless/cqm22x-modem-proc.git"
          echo "MODEM_BRANCH=main"
          echo "CHIPCODE_REPO=git@github.com:cavli-wireless/cqm22x-chipcode.git"
          echo "CHIPCODE_BRANCH=main"
          echo "BUILD_SCRIPT_REPO=git@github.com:cavli-wireless/cqm22x-build-scripts.git"
          echo "BUILD_SCRIPT_BRANCH=main"
          echo "CAVLI_SERVICES_REPO=git@github.com:cavli-wireless/cavli_linux_services.git"
          echo "CAVLI_SERVICES_BRANCH=owrt_sdx35"
          echo "CAVLI_SDK_REPO=git@github.com:cavli-wireless/cavli_sdk_tools_linux.git"
          echo "CAVLI_SDK_BRANCH=owrt_sdx35"
          echo ""
          echo "# Version Information (REQUIRED)"
          echo "SOFTWARE_VERSION=1.0.3"
          echo "MODEM_VERSION=1.0.1"
          echo ""
          echo "# Build Configuration"
          echo "PROFILE_BUILD=LP2"
          echo ""
          echo "# Release Tag"
          echo "RELEASE_TAG=main"
          echo ""
          exit 1
        fi

    # Step 2: Clean workspace
    - name: Clean Workspace
      run: |
        echo "Cleaning workspace..."
        cd ${{ env.WORKSPACE_ROOT }}

        # Remove existing chipcode directory if it exists -- every build still starts from
        # a genuinely clean working tree (no leftover build_dir/staging_dir/.config cruft).
        if [ -d "chipcode" ]; then
          echo "🗑️ Removing existing chipcode directory..."
          sudo rm -rf chipcode
          echo "✅ Chipcode directory cleaned"
        else
          echo "ℹ️ No existing chipcode directory found"
        fi

        # .repo/ (repo tool's git object cache) is intentionally KEPT across runs so the
        # next "repo sync" is an incremental fetch instead of a full re-clone of every
        # project. It self-heals if it ever causes a problem -- see Initialize Repo Tool.

    # Step 3: Initialize Repo Tool
    - name: Initialize Repo Tool
      timeout-minutes: 90
      run: |
        cd ${{ env.WORKSPACE_ROOT }}

        echo "🔄 Cloning manifests repo at ref: $RELEASE_TAG..."
        MANIFESTS_CLONE="${{ env.WORKSPACE_ROOT }}/.manifests_clone"
        rm -rf "$MANIFESTS_CLONE"
        if git clone git@github.com:cavli-wireless/cqm22x-manifests.git "$MANIFESTS_CLONE"; then
          echo "✅ Manifests repo cloned successfully"
        else
          echo "❌ Failed to clone manifests repo"
          exit 1
        fi
        cd "$MANIFESTS_CLONE"
        if git checkout "$RELEASE_TAG"; then
          echo "✅ Checked out ref: $RELEASE_TAG"
        else
          echo "❌ Failed to checkout ref: $RELEASE_TAG (branch or tag not found)"
          exit 1
        fi
        # Create a local branch so repo init can reference it (avoids detached HEAD issue)
        git checkout -B repo-manifest-branch

        # Apply per-project revision overrides from the workflow_dispatch inputs (UI),
        # instead of requiring a hand-edit of chipcode-cqm22x-3-qcom-refs.xml in
        # cqm22x-manifests for a one-off test of a different branch/tag/commit. Blank
        # input = leave that project's <project revision="..."/> exactly as pinned in
        # the manifest (today's default behavior, unchanged).
        MANIFEST_FILE_TO_PATCH="$MANIFESTS_CLONE/chipcode-cqm22x-3-qcom-refs.xml"
        # NOTE: the heredoc body below is written at this step's 8-space baseline
        # (like every other line in this run: | block) purely so the YAML file
        # itself stays valid -- YAML's block-scalar folding strips that common
        # 8-space baseline before bash ever sees this script, so what bash (and
        # then python3) actually receives is the heredoc body dedented back to
        # column 0, with each line's *relative* indentation beyond the baseline
        # preserved intact. Do NOT pipe through sed to strip it again -- that
        # double-strips already-dedented lines and corrupts relative indentation
        # (confirmed the hard way: broke `if not revision: / continue`).
        python3 - "$MANIFEST_FILE_TO_PATCH" <<'PYEOF'
        import re
        import sys

        path = sys.argv[1]
        overrides = {
            "cqm22x-apps-proc": """${{ inputs.app_proc_revision }}""",
            "cqm22x-modem-proc": """${{ inputs.modem_proc_revision }}""",
            "cqm22x-chipcode": """${{ inputs.chipcode_revision }}""",
            "cqm22x-build-scripts": """${{ inputs.build_scripts_revision }}""",
            "cavli_linux_services": """${{ inputs.cavli_services_revision }}""",
            "cavli_sdk_tools_linux": """${{ inputs.cavli_sdk_revision }}""",
        }

        with open(path) as f:
            content = f.read()

        for name, revision in overrides.items():
            revision = revision.strip()
            if not revision:
                continue
            pattern = re.compile(r'(<project\s+name="%s"[^>]*?revision=")[^"]*(")' % re.escape(name))
            content, n = pattern.subn(lambda m, r=revision: m.group(1) + r + m.group(2), content)
            if n == 0:
                print(f"⚠️ WARNING: project '{name}' not found in manifest -- override ignored", file=sys.stderr)
            else:
                print(f"🎛️ Overriding {name} revision -> {revision}")

        with open(path, "w") as f:
            f.write(content)
        PYEOF

        # `repo init -u "$MANIFESTS_CLONE"` clones/fetches this path as a git remote,
        # which only sees committed history -- NOT the working-tree edit the Python
        # block above just made. Without this commit, repo silently ignores the
        # override and syncs whatever revision was already committed (confirmed the
        # hard way: run 31165277014 patched the file on disk correctly but repo
        # still checked out the old sdx35-3-pinned commit). Commit is local-only,
        # never pushed anywhere -- $MANIFESTS_CLONE is a disposable per-run clone.
        if ! git diff --quiet; then
          git config user.email "ci@cavli-wireless.local"
          git config user.name "CI Revision Override"
          git commit -am "CI: apply workflow_dispatch revision overrides (local-only, not pushed)"
          echo "✅ Committed revision overrides to local manifest clone"
        else
          echo "ℹ️ No revision overrides requested -- manifest unchanged"
        fi

        cd ${{ env.WORKSPACE_ROOT }}

        # .repo/ is normally kept across runs (see Clean Workspace step), so this is usually
        # an incremental fetch, not a full clone. --depth=1 keeps each project shallow for
        # speed. If the cached .repo state causes any problem -- init, sync, or LFS pull --
        # wipe it and retry once from a completely fresh clone, so a stale/corrupt cache can
        # never hard-fail the build; it just costs one full sync instead of a fast one.
        run_repo_sync() {
          echo "🔄 Initializing repo with manifest (depth=1)..."
          repo init -u "$MANIFESTS_CLONE" -b repo-manifest-branch -m chipcode-cqm22x-3-qcom-refs.xml --depth=1 || return 1
          echo "✅ Repo initialized successfully"

          echo "🔄 Syncing repositories..."
          # Uncapped, repo defaults --jobs to nproc (192 on this runner) and
          # itself warns: "High job count (192 > 100) specified for --jobs;
          # this may lead to excessive resource usage or diminishing
          # returns." Cap at 64, same ceiling used for make/scons in
          # build-scripts, for the same oversubscription reason.
          repo sync -j64 || return 1
          echo "✅ Repo sync completed successfully"

          echo "🔄 Pulling LFS files..."
          repo forall -c git lfs pull || return 1
          echo "✅ LFS files pulled successfully"
        }

        if run_repo_sync; then
          echo "✅ Repo ready (used cached .repo state)"
        else
          echo "⚠️ Repo init/sync/LFS failed -- wiping .repo cache and retrying once from a fresh clone"
          rm -rf .repo
          if run_repo_sync; then
            echo "✅ Repo ready (fresh clone after cache wipe)"
          else
            echo "❌ Repo sync failed even after a full clean retry"
            exit 1
          fi
        fi

        echo "✅ All repositories cloned successfully"

    # Step 3b: Cherry-pick Verify Commit(s) -- verify-only (blank cherry_pick_sha is a
    # no-op, which is always the case for build-release since it doesn't expose this
    # input). Runs after repo sync so it operates on the real checkouts, not the
    # disposable manifest clone -- the manifest-revision-override mechanism above can
    # only select an existing named ref, it can't inject an ad-hoc commit that was
    # never pushed as a branch/tag, so this has to be a separate step working directly
    # in each project's working tree.
    - name: Cherry-pick Verify Commit(s)
      if: inputs.cherry_pick_sha != ''
      timeout-minutes: 15
      run: |
        cd ${{ env.CHIPCODE_ROOT }}

        # One or more SHAs, comma- and/or newline-separated (either works, mix freely).
        # Multiple SHAs for the SAME repo are applied in the order given -- matters if
        # a later one depends on an earlier one. Multiple SHAs across DIFFERENT repos
        # just each land on their own project, independently.
        readarray -t SHA_LIST < <(echo "${{ inputs.cherry_pick_sha }}" | tr ',' '\n' | xargs -n1 echo 2>/dev/null | grep -v '^$')

        if [ ${#SHA_LIST[@]} -eq 0 ]; then
          echo "ℹ️ cherry_pick_sha was set but parsed to zero commits -- nothing to do"
          exit 0
        fi

        echo "🍒 ${#SHA_LIST[@]} commit(s) to verify: ${SHA_LIST[*]}"

        # name -> checkout path, same 6 projects as the revision-override inputs above.
        declare -A PROJECT_PATHS=(
          [cqm22x-apps-proc]="OWRT.PRODUCT.2.1/apps_proc"
          [cqm22x-modem-proc]="MPSS.CY.1.0/modem_proc"
          [cqm22x-chipcode]="."
          [cqm22x-build-scripts]="build"
          [cavli_linux_services]="OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli"
          [cavli_sdk_tools_linux]="OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk"
        )
        # Tracks which repos we've already paid the un-shallow cost for, so a second
        # SHA landing in the same repo doesn't redo it.
        declare -A UNSHALLOWED
        SUMMARY_LINES=()

        for SHA in "${SHA_LIST[@]}"; do
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "🔍 Looking for commit $SHA across all 6 projects (you only need the SHA -- this finds which repo it belongs to)..."
          FOUND_NAME=""
          FOUND_PATH=""
          for name in "${!PROJECT_PATHS[@]}"; do
            p="${PROJECT_PATHS[$name]}"
            echo "  checking $name ($p)..."
            # Each checkout's "origin" remote already points at the right GitHub repo
            # (set up by repo sync from the manifest) -- no separate URL list needed.
            # GitHub supports fetching an arbitrary reachable SHA1 directly, not just
            # named refs, so this either succeeds (found it) or fails cleanly (not here).
            if git -C "$p" fetch origin "$SHA" --depth=1 2>/dev/null; then
              echo "  ✅ found in $name"
              FOUND_NAME="$name"
              FOUND_PATH="$p"
              break
            fi
          done

          if [ -z "$FOUND_NAME" ]; then
            echo "💥 Commit $SHA not found in any of the 6 projects -- wrong SHA, or it was never pushed to that repo's remote"
            exit 1
          fi

          # repo sync only ever does --depth=1, and the detection fetch above used
          # --depth=1 too (kept cheap since 5 of 6 checks are normally misses) -- so at
          # this point neither the local HEAD nor the just-fetched $SHA has its parent
          # commit available locally. cherry-pick's 3-way merge needs that parent to
          # diff against, or every file the commit touches looks like a fabricated
          # "add/add" conflict instead of a real one (confirmed the hard way: this
          # exact SHA cherry-picks cleanly by hand with full history, but failed here
          # with a bogus add/add conflict on owrt/owrt-qti-conf/set_openwrt_env.sh).
          # Get full history for this ONE project only, once -- the other repos (and
          # this one, on a 2nd SHA landing here) stay/are already unshallowed, so this
          # doesn't slow down a cherry-pick-free run at all.
          if [ -z "${UNSHALLOWED[$FOUND_NAME]:-}" ]; then
            echo "📥 Un-shallowing $FOUND_NAME (need the picked commit's parent for a real 3-way merge)..."
            if [ "$(git -C "$FOUND_PATH" rev-parse --is-shallow-repository)" = "true" ]; then
              git -C "$FOUND_PATH" fetch --unshallow origin "$SHA"
            else
              git -C "$FOUND_PATH" fetch origin "$SHA"
            fi
            UNSHALLOWED[$FOUND_NAME]=1
          else
            # Already unshallowed from an earlier SHA in this same loop -- still need
            # to actually fetch THIS SHA's object into the now-complete history.
            git -C "$FOUND_PATH" fetch origin "$SHA"
          fi

          echo ""
          echo "🍒 Cherry-picking $SHA onto ${FOUND_NAME}'s current checkout (branch: $(git -C "$FOUND_PATH" rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached))"
          if ! git -C "$FOUND_PATH" cherry-pick FETCH_HEAD; then
            echo "💥 Cherry-pick failed (conflict) -- aborting cleanly instead of leaving a half-applied tree"
            git -C "$FOUND_PATH" cherry-pick --abort || true
            exit 1
          fi

          echo "✅ Cherry-pick applied to $FOUND_NAME (local only to this runner, never pushed anywhere)"
          SUMMARY_LINES+=("${SHA:0:10} -> ${FOUND_NAME}")
        done

        echo ""
        echo "🍒 All ${#SHA_LIST[@]} commit(s) applied:"
        printf '  %s\n' "${SUMMARY_LINES[@]}"
        # Multi-line env var: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#multiline-strings
        {
          echo "CHERRY_PICK_SUMMARY<<EOF_CHERRY_SUMMARY"
          printf '%s\n' "${SUMMARY_LINES[@]}"
          echo "EOF_CHERRY_SUMMARY"
        } >> $GITHUB_ENV

    # Step 4: Verify All Repositories
    - name: Verify Repository Structure
      timeout-minutes: 10
      run: |
        echo "Verifying all repositories are cloned successfully..."
        cd ${{ env.WORKSPACE_ROOT }}/chipcode
        echo "📂 Chipcode directory structure:"
        ls -la

        echo ""
        echo "📊 Main Repository Summary:"
        echo "📁 Chipcode (main): $(pwd)"
        echo "├── 📱 Apps Proc: $(ls -d OWRT.PRODUCT.2.1/apps_proc 2>/dev/null && echo '✅ OK' || echo '❌ MISSING')"
        echo "├── 📡 Modem Proc: $(ls -d MPSS.CY.1.0/modem_proc 2>/dev/null && echo '✅ OK' || echo '❌ MISSING')"
        echo "└── 🛠️ Build Scripts: $(ls -d build 2>/dev/null && echo '✅ OK' || echo '❌ MISSING')"

        echo ""
        echo "📊 Nested Repository Summary:"
        echo "└── 📁 apps_proc/owrt/src/"
        echo "    ├── 🔧 Cavli Services: $(ls -d OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli 2>/dev/null && echo '✅ OK' || echo '❌ MISSING')"
        echo "    └── 🔧 Cavli SDK: $(ls -d OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk 2>/dev/null && echo '✅ OK' || echo '❌ MISSING')"

    # Step 5: Prepare Version Info
    # Actual file stamping (VERSION_MAJOR/MINOR/PATCH, CAVLI_FW_VER_I, CAVLI_MODEL_I) now
    # happens inside build.sh itself (via -v/-w/-M), see "Build All Modules" step below.
    # This step only validates + exposes the values for naming/reporting downstream.
    - name: Prepare Version Info
      timeout-minutes: 5
      run: |
        if [ -z "${SOFTWARE_VERSION:-}" ]; then
          echo "💥 CRITICAL ERROR: SOFTWARE_VERSION is required but not found!"
          exit 1
        fi
        if [ -z "${MODEM_VERSION:-}" ]; then
          echo "💥 CRITICAL ERROR: MODEM_VERSION is required but not found!"
          exit 1
        fi

        IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$SOFTWARE_VERSION"

        echo "📋 Software Version: $SOFTWARE_VERSION (MAJOR=$VERSION_MAJOR MINOR=$VERSION_MINOR PATCH=$VERSION_PATCH)"
        echo "📋 Modem Version: $MODEM_VERSION"

        echo "SOFTWARE_VERSION_USED=$SOFTWARE_VERSION" >> $GITHUB_ENV
        echo "MODEM_VERSION_USED=$MODEM_VERSION" >> $GITHUB_ENV
        echo "VERSION_MAJOR=$VERSION_MAJOR" >> $GITHUB_ENV
        echo "VERSION_MINOR=$VERSION_MINOR" >> $GITHUB_ENV
        echo "VERSION_PATCH=$VERSION_PATCH" >> $GITHUB_ENV

    # Step 6: Generate Build Version
    - name: Generate Build Version
      timeout-minutes: 10
      id: version
      run: |
        cd ${{ env.WORKSPACE_ROOT }}/chipcode

        # Create version based on meta config or auto-generate
        if [ -n "$RELEASE_TAG" ]; then
          VERSION="$RELEASE_TAG"
          echo "🏷️ Using release tag from meta_release.txt: $RELEASE_TAG"
        else
          # Get commit hashes from all repos for unique version
          CHIPCODE_HASH=$(git rev-parse --short HEAD)
          APP_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc && git rev-parse --short HEAD)
          MODEM_HASH=$(cd MPSS.CY.1.0/modem_proc && git rev-parse --short HEAD)
          BUILD_HASH=$(cd build && git rev-parse --short HEAD)
          CAVLI_SERVICES_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli && git rev-parse --short HEAD)
          CAVLI_SDK_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk && git rev-parse --short HEAD)
          VERSION="cqm22x-$(date +'%Y%m%d_%H%M')-app${APP_HASH}_modem${MODEM_HASH}_chipcode${CHIPCODE_HASH}_build${BUILD_HASH}_cavli_services${CAVLI_SERVICES_HASH}_cavli_sdk${CAVLI_SDK_HASH}"
          echo "🏷️ Auto-generated version from commit hashes"
        fi

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "🏷️ Generated Build Version: $VERSION"

        # Save version info
        echo "=== CQM22x sdx35-3 qcom_refs Build Version Information ===" > build_info.txt
        echo "Build Version: $VERSION" >> build_info.txt
        echo "Build Date: $(date)" >> build_info.txt
        echo "Triggered by: ${{ github.actor }}" >> build_info.txt
        echo "Build Type: Clean Build (Full Clone)" >> build_info.txt
        if [ -n "${{ env.CHERRY_PICK_SUMMARY }}" ]; then
          echo "Cherry-picked:" >> build_info.txt
          echo "${{ env.CHERRY_PICK_SUMMARY }}" | sed 's/^/  - /' >> build_info.txt
        fi
        echo "" >> build_info.txt
        echo "Software Version Information:" >> build_info.txt
        echo "- Software Version: ${{ env.SOFTWARE_VERSION_USED }}" >> build_info.txt
        echo "- Version Major: $VERSION_MAJOR" >> build_info.txt
        echo "- Version Minor: $VERSION_MINOR" >> build_info.txt
        echo "- Version Patch: $VERSION_PATCH" >> build_info.txt
        echo "- Modem Version: ${{ env.MODEM_VERSION_USED }}" >> build_info.txt
        echo "" >> build_info.txt
        echo "Configuration Source: meta_release.txt" >> build_info.txt
        echo "" >> build_info.txt
        echo "Build manifest:" >> build_info.txt
        echo "- https://github.com/cavli-wireless/cqm22x-manifests/blob/khoa_dev/chipcode-cqm22x-3-qcom-refs.xml" >> build_info.txt
        echo "" >> build_info.txt
        echo "Build Configuration:" >> build_info.txt
        echo "- Build Profile: ${{ env.PROFILE_BUILD }}" >> build_info.txt
        echo "" >> build_info.txt
        echo "Repository Commit Information:" >> build_info.txt

        # Chipcode (main repository)
        echo "- Chipcode:" >> build_info.txt
        echo "  * Commit Hash: $(git rev-parse HEAD)" >> build_info.txt
        echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> build_info.txt
        echo "  * Message: $(git log -1 --pretty=format:'%s')" >> build_info.txt
        echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> build_info.txt

        # Apps Proc repository
        if [ -d "OWRT.PRODUCT.2.1/apps_proc" ]; then
          cd OWRT.PRODUCT.2.1/apps_proc
          echo "- Apps Proc:" >> ../../build_info.txt
          echo "  * Commit Hash: $(git rev-parse HEAD)" >> ../../build_info.txt
          echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> ../../build_info.txt
          echo "  * Message: $(git log -1 --pretty=format:'%s')" >> ../../build_info.txt
          echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> ../../build_info.txt
          cd ../..
        fi

        # Modem Proc repository
        if [ -d "MPSS.CY.1.0/modem_proc" ]; then
          cd MPSS.CY.1.0/modem_proc
          echo "- Modem Proc:" >> ../../build_info.txt
          echo "  * Commit Hash: $(git rev-parse HEAD)" >> ../../build_info.txt
          echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> ../../build_info.txt
          echo "  * Message: $(git log -1 --pretty=format:'%s')" >> ../../build_info.txt
          echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> ../../build_info.txt
          cd ../..
        fi

        # Build Scripts repository
        if [ -d "build" ]; then
          cd build
          echo "- Build Scripts:" >> ../build_info.txt
          echo "  * Commit Hash: $(git rev-parse HEAD)" >> ../build_info.txt
          echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> ../build_info.txt
          echo "  * Message: $(git log -1 --pretty=format:'%s')" >> ../build_info.txt
          echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> ../build_info.txt
          cd ..
        fi

        # Cavli Services repository
        if [ -d "OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli" ]; then
          cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli
          echo "- Cavli Services:" >> ../../../../build_info.txt
          echo "  * Commit Hash: $(git rev-parse HEAD)" >> ../../../../build_info.txt
          echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> ../../../../build_info.txt
          echo "  * Message: $(git log -1 --pretty=format:'%s')" >> ../../../../build_info.txt
          echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> ../../../../build_info.txt
          cd ../../../../..
        fi

        # Cavli SDK repository
        if [ -d "OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk" ]; then
          cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk
          echo "- Cavli SDK:" >> ../../../../../build_info.txt
          echo "  * Commit Hash: $(git rev-parse HEAD)" >> ../../../../../build_info.txt
          echo "  * Author: $(git log -1 --pretty=format:'%an <%ae>')" >> ../../../../../build_info.txt
          echo "  * Message: $(git log -1 --pretty=format:'%s')" >> ../../../../../build_info.txt
          echo "  * Date: $(git log -1 --pretty=format:'%ad')" >> ../../../../../build_info.txt
          cd ../../../../..
        fi

        cat build_info.txt

    # Step 7: Generate build manifest
    - name: Generate build manifest
      timeout-minutes: 10
      run: |
        echo "Generating release build manifest..."
        cd ${{ env.WORKSPACE_ROOT }}/chipcode

        # Create release manifest with current commit hashes
        SOFTWARE_VER="${{ env.SOFTWARE_VERSION_USED || 'unknown' }}"
        MANIFEST_FILE="${{ env.WORKSPACE_ROOT }}/chipcode/release_${SOFTWARE_VER}_manifest.xml"

        echo "📝 Creating release build manifest: $MANIFEST_FILE"

        # Get current commit hashes from each repository
        CHIPCODE_HASH=$(git rev-parse HEAD)
        APP_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc && git rev-parse HEAD)
        MODEM_HASH=$(cd MPSS.CY.1.0/modem_proc && git rev-parse HEAD)
        BUILD_HASH=$(cd build && git rev-parse HEAD)
        CAVLI_SERVICES_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli && git rev-parse HEAD)
        CAVLI_SDK_HASH=$(cd OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk && git rev-parse HEAD)

        echo "📋 Repository commit hashes:"
        echo "  - Chipcode: $CHIPCODE_HASH"
        echo "  - Apps Proc: $APP_HASH"
        echo "  - Modem Proc: $MODEM_HASH"
        echo "  - Build Scripts: $BUILD_HASH"
        echo "  - Cavli Services: $CAVLI_SERVICES_HASH"
        echo "  - Cavli SDK: $CAVLI_SDK_HASH"

        # Generate the manifest XML file
        echo '<?xml version="1.0" encoding="UTF-8"?>' > "$MANIFEST_FILE"
        echo '<manifest>' >> "$MANIFEST_FILE"
        echo '  <remote fetch="ssh://git@github.com/" name="origin" depth="1" />' >> "$MANIFEST_FILE"
        echo '' >> "$MANIFEST_FILE"
        echo '  <!-- Cavli Git Projects  -->' >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cqm22x-apps-proc\"     path=\"chipcode/OWRT.PRODUCT.2.1/apps_proc\"  remote=\"origin\" revision=\"$APP_HASH\" />" >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cqm22x-modem-proc\"    path=\"chipcode/MPSS.CY.1.0/modem_proc\" remote=\"origin\" revision=\"$MODEM_HASH\" />" >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cqm22x-chipcode\"      path=\"chipcode/\"           remote=\"origin\" revision=\"$CHIPCODE_HASH\" />" >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cqm22x-build-scripts\" path=\"chipcode/build\"      remote=\"origin\" revision=\"$BUILD_HASH\" />" >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cavli_linux_services\" path=\"chipcode/OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli\" remote=\"origin\" revision=\"$CAVLI_SERVICES_HASH\" />" >> "$MANIFEST_FILE"
        echo "  <project name=\"cavli-wireless/cavli_sdk_tools_linux\" path=\"chipcode/OWRT.PRODUCT.2.1/apps_proc/owrt/src/cavli/cavli-sdk\" remote=\"origin\" revision=\"$CAVLI_SDK_HASH\" />" >> "$MANIFEST_FILE"
        echo '' >> "$MANIFEST_FILE"
        echo '</manifest>' >> "$MANIFEST_FILE"

        echo "✅ Release build manifest created successfully"
        echo "📋 Manifest file contents:"
        cat "$MANIFEST_FILE"

        # Add manifest info to build_info.txt
        echo "" >> build_info.txt
        echo "Release Build Manifest:" >> build_info.txt
        echo "- File: release_${SOFTWARE_VER}_manifest.xml" >> build_info.txt
        echo "- Description: Exact commit hashes used for this build" >> build_info.txt
        echo "- Usage: Use this manifest to reproduce the exact same build" >> build_info.txt

    # Step 8: Setup Build Configuration
    - name: Setup Build Configuration
      timeout-minutes: 5
      run: |
        echo "Setting up CQM22x build configuration..."
        # Use meta config - no fallback
        PROFILE_BUILD_TO_USE="$PROFILE_BUILD"

        echo "Build Profile: $PROFILE_BUILD_TO_USE"

        # Navigate to chipcode directory
        cd ${{ env.CHIPCODE_ROOT }}
        echo "Working directory: $(pwd)"

        # Make build script executable
        chmod +x ./build/build.sh

        # Define build modules array
        BUILD_MODULES=("rpm" "boot" "modem" "tz" "app" "recovery" "meta")

        echo "🔧 Build Profile: $PROFILE_BUILD_TO_USE"
        echo "📋 Build modules defined: ${BUILD_MODULES[@]}"

        # Set build profile for subsequent steps
        echo "BUILD_PROFILE=$PROFILE_BUILD_TO_USE" >> $GITHUB_ENV

        # Check module configuration (default to yes if not specified)
        echo "🔍 Checking module build configuration:"
        echo "BUILD_BOOT=${BUILD_BOOT:-yes}" >> $GITHUB_ENV
        echo "BUILD_MODEM=${BUILD_MODEM:-yes}" >> $GITHUB_ENV
        echo "BUILD_TZ=${BUILD_TZ:-yes}" >> $GITHUB_ENV
        echo "BUILD_APP=${BUILD_APP:-yes}" >> $GITHUB_ENV
        echo "BUILD_RECOVERY=${BUILD_RECOVERY:-yes}" >> $GITHUB_ENV
        echo "BUILD_META=${BUILD_META:-yes}" >> $GITHUB_ENV
        echo "BUILD_AOP=${BUILD_AOP:-yes}" >> $GITHUB_ENV

        echo "  - BOOT: ${BUILD_BOOT:-yes}"
        echo "  - MODEM: ${BUILD_MODEM:-yes}"
        echo "  - TZ: ${BUILD_TZ:-yes}"
        echo "  - APP: ${BUILD_APP:-yes}"
        echo "  - RECOVERY: ${BUILD_RECOVERY:-yes}"
        echo "  - META: ${BUILD_META:-yes}"
        echo "  - AOP (RPM): ${BUILD_AOP:-yes}"

        echo "✅ Build configuration setup completed"

    # Step 9: Build All Modules (parallel)
    - name: Build All Modules (parallel)
      timeout-minutes: 90
      run: |
        echo "SANDBOX TEST: full build (-m all) — boot/modem/tz/app/recovery/meta + SDK gen"
        cd ${{ env.CHIPCODE_ROOT }}

        PROFILE="${{ env.BUILD_PROFILE }}"
        MAX_ATTEMPTS=2
        ATTEMPT=1

        echo "🔧 Modules: all"
        echo "🔧 Profile: $PROFILE"
        echo "🔧 Software version: $SOFTWARE_VERSION / Modem version: $MODEM_VERSION"

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo ""
          echo "🔄 Building all modules (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
          echo "Command: ./build/build.sh -t $PROFILE -m all -p -V $SOFTWARE_VERSION -w $MODEM_VERSION -M CQM220-3"

          if ./build/build.sh -t "$PROFILE" -m all -p -V "$SOFTWARE_VERSION" -w "$MODEM_VERSION" -M "CQM220-3"; then
            echo "✅ All modules built successfully"
            break
          else
            EXIT_CODE=$?
            echo "❌ Module build failed with exit code: $EXIT_CODE"

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "💥 Build failed after $MAX_ATTEMPTS attempts"
              exit $EXIT_CODE
            else
              # build.sh truncates build_logs/*.log and timing.log fresh on every
              # invocation, so without this a failed attempt's logs (the ones that
              # actually explain the failure) are gone the moment the retry starts
              # writing over them -- confirmed the hard way in run 31193162213,
              # where attempt 1's "app" failure was unrecoverable because attempt 2
              # had already overwritten build_approc.log by the time anyone looked.
              if [ -d build_logs ]; then
                mv build_logs "build_logs.attempt${ATTEMPT}"
                echo "📦 Preserved attempt ${ATTEMPT}'s logs -> build_logs.attempt${ATTEMPT}/"
              fi
              echo "🔄 Retrying build..."
              ATTEMPT=$((ATTEMPT + 1))
              sleep 5
            fi
          fi
        done

    # Upload build logs (per-module logs + timing.log) so they can be downloaded from the
    # Actions run page, regardless of whether the build step above succeeded or failed.
    - name: Upload Build Logs
      if: always()
      id: upload_logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_id }}
        # build_logs/ is the last (successful, or final failed) attempt; any earlier
        # failed attempt's logs were preserved under build_logs.attemptN/ before the
        # retry overwrote them -- see the retry loop above.
        path: |
          ${{ env.CHIPCODE_ROOT }}/build_logs/
          ${{ env.CHIPCODE_ROOT }}/build_logs.attempt*/
        if-no-files-found: warn
        retention-days: 14

    # Step 10: Verify App Module Output
    - name: Verify App Module Output
      timeout-minutes: 90
      if: env.BUILD_APP == 'yes'
      run: |
        echo "Verifying app output files..."
        cd ${{ env.CHIPCODE_ROOT }}

        PROFILE="${{ env.BUILD_PROFILE }}"

        PROFILE_FOLDER=""
        case "$PROFILE" in
          "LP2")
            PROFILE_FOLDER="mbb-cavli"
            ;;
          "QLP2")
            PROFILE_FOLDER="mbb"
            ;;
          "C_M2")
            PROFILE_FOLDER="m2-cavli"
            ;;
          "MBB-CAV")
            PROFILE_FOLDER="mbb-cavli"
            ;;
          *)
            echo "💥 Unknown build profile: $PROFILE"
            exit 1
            ;;
        esac

        MAX_MANUAL_ATTEMPTS=2
        MANUAL_ATTEMPT=1
        BUILD_SUCCESS=no

        while [ $MANUAL_ATTEMPT -le $MAX_MANUAL_ATTEMPTS ]; do
          echo ""
          echo "🔍 Verifying app output files (verification attempt $MANUAL_ATTEMPT/$MAX_MANUAL_ATTEMPTS)..."

          APP_OUTPUT_DIR="${{ env.CHIPCODE_ROOT }}/OWRT.PRODUCT.2.1/apps_proc/owrt/bin/targets/perf/sdx35/${PROFILE_FOLDER}"
          echo "📁 App output directory: $APP_OUTPUT_DIR"

          NEED_TO_MANUALLY=no
          if [ "$PROFILE" = "C_M2" ]; then
            EXPECTED_FILES=("boot.img" "abl.elf" "sysfs-2k.ubi")
          else
            EXPECTED_FILES=("boot.img" "abl.elf" "sysfs-2k.ubi" "sysfs.ubi")
          fi
          for FILE in "${EXPECTED_FILES[@]}"; do
            if [ -f "${APP_OUTPUT_DIR}/${FILE}" ]; then
              echo "✅ Found expected app output file: ${FILE}"
            else
              echo "💥 Missing expected app output file: ${FILE}"
              NEED_TO_MANUALLY=yes
            fi
          done

          if [ "$NEED_TO_MANUALLY" = "no" ]; then
            echo "✅ All expected app output files are present."
            BUILD_SUCCESS=yes
            break
          fi

          # Files are missing, try manual build
          echo "❌ App module build did not produce all expected output files."
          echo "🔄 Attempting manual build (attempt $MANUAL_ATTEMPT/$MAX_MANUAL_ATTEMPTS)..."

          cd "${{ env.CHIPCODE_ROOT }}/OWRT.PRODUCT.2.1/apps_proc/owrt"

          echo "🔧 Setting up OpenWRT environment..."
          if ! source owrt-qti-conf/set_openwrt_env.sh; then
            echo "💥 Failed to source OpenWRT environment"
            cd "${{ env.CHIPCODE_ROOT }}"
            MANUAL_ATTEMPT=$((MANUAL_ATTEMPT + 1))
            continue
          fi

          echo "🔨 Building main targets to detect which package failed..."
          make -j$(nproc) V=sc | tee build.log || true

          FAILED_PKGS=$(grep -oP "(?<=ERROR: package/feeds/)[^ ]+" build.log | sort -u)

          if [ -n "$FAILED_PKGS" ]; then
            echo "📦 Detected failed packages:"
            echo "$FAILED_PKGS"
            for PKG in $FAILED_PKGS; do
              echo "🔄 Retrying build for $PKG..."
              make package/feeds/$PKG/{clean,compile} -j1 V=sc || true
            done
          fi

          echo "🔨 Running final build..."
          if ! make -j$(nproc); then
            echo "💥 Final build failed on attempt $MANUAL_ATTEMPT"
            cd "${{ env.CHIPCODE_ROOT }}"
            MANUAL_ATTEMPT=$((MANUAL_ATTEMPT + 1))
            continue
          fi

          echo "✅ Manual build completed successfully"
          # Return to chipcode root to verify files in next iteration
          cd "${{ env.CHIPCODE_ROOT }}"

          # Increment attempt counter and loop back to verify files
          MANUAL_ATTEMPT=$((MANUAL_ATTEMPT + 1))
        done

        # Final verification after all attempts
        if [ "$BUILD_SUCCESS" != "yes" ]; then
          echo "💥 Failed to produce all expected app output files after $MAX_MANUAL_ATTEMPTS attempts"
          exit 1
        fi

    # Step 11: Build OTA Package
    - name: Build OTA Package
      timeout-minutes: 40
      run: |
        echo "Building OTA package..."

        echo "Skipping work, but success"
        exit 0

        cd ${{ env.CHIPCODE_ROOT }}

        PROFILE="${{ env.BUILD_PROFILE }}"

        case "$PROFILE" in
          "LP2")
            PROFILE_FOLDER="mbb-cavli"
            ;;
          "QLP2")
            PROFILE_FOLDER="mbb"
            ;;
          "C_M2")
            PROFILE_FOLDER="m2-cavli"
            ;;
          "MBB-CAV")
            PROFILE_FOLDER="mbb-cavli"
            ;;
          *)
            echo "💥 Unknown build profile: $PROFILE"
            exit 1
            ;;
        esac

        echo "🔧 Running OTA build script..."
        echo "Command: ./build/build_ota.sh -t $PROFILE_FOLDER --full"

        if ./build/build_ota.sh -t "$PROFILE_FOLDER" --full; then
          echo "✅ OTA package built successfully"
        else
          EXIT_CODE=$?
          echo "❌ OTA package build failed with exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi

    # Step 12: Create Release Package
    - name: Create Release Package
      if: success()
      run: |
        echo "Creating release package..."

        # Navigate back to workspace root
        cd ${{ env.WORKSPACE_ROOT }}

        # Generate release folder name using meta config or fallback
        SOFTWARE_VER="${{ env.SOFTWARE_VERSION_USED || 'unknown' }}"
        MODEM_VER="${{ env.MODEM_VERSION_USED || 'unknown' }}"
        MODEM_VER="${MODEM_VER%% *}"
        BUILD_TIME="$(date +'%Y%m%d_%H%M')"
        RELEASE_FOLDER="sdx35-3-qcom_refs_S${SOFTWARE_VER}_M${MODEM_VER}_${BUILD_TIME}"

        echo "📁 Creating release folder: $RELEASE_FOLDER"
        mkdir -p "$RELEASE_FOLDER"

        echo "🔍 Looking for SDK and firmware files in chipcode directory..."
        cd chipcode

        cp ./build_info.txt "../$RELEASE_FOLDER/"  2>/dev/null || echo "ℹ️ No build_info.txt found to copy"
        cp ./release_${SOFTWARE_VER}_manifest.xml "../$RELEASE_FOLDER/" 2>/dev/null || echo "ℹ️ No release_${SOFTWARE_VER}_manifest.xml found to copy"

        # Find binaries archive (Kuno.LEI.1.0_SDX35_<timestamp>_binaries.tar.gz --
        # already produced, pigz-compressed, by get_meta.sh during the "meta" build
        # step. No need to re-compress binaries/ into a separate .zip here -- that
        # used to happen in a since-removed "Compress Binaries" step, which just
        # redid (single-threaded, via zip) work get_meta.sh already did in parallel.)
        BINARIES_FILES=$(find . -maxdepth 1 -name "Kuno.LEI.1.0_SDX35_*_binaries.tar.gz" -type f)
        if [ -n "$BINARIES_FILES" ]; then
          echo "📦 Found binaries archive:"
          echo "$BINARIES_FILES"
          for file in $BINARIES_FILES; do
            echo "  📁 Copying $(basename "$file")"
            cp "$file" "../$RELEASE_FOLDER/"
          done
        else
          echo "⚠️ No binaries archive (Kuno.LEI.1.0_SDX35_*_binaries.tar.gz) found"
        fi

        # Find SDK files (sdk-*.tar.gz)
        SDK_FILES=$(find . -maxdepth 1 -name "sdk-*.tar.gz" -type f)
        if [ -n "$SDK_FILES" ]; then
          echo "📦 Found SDK files:"
          echo "$SDK_FILES"
          for file in $SDK_FILES; do
            echo "  📁 Copying $(basename "$file")"
            cp "$file" "../$RELEASE_FOLDER/"
          done
        else
          echo "⚠️ No SDK files (sdk-*.tar.gz) found"
        fi

        # Find firmware files (Kuno.LE.1.0_SDX35_*_qcap.zip)
        FIRMWARE_FILES=$(find . -maxdepth 1 -name "Kuno.LE.1.0_SDX35_*_qcap.zip" -type f)
        if [ -n "$FIRMWARE_FILES" ]; then
          echo "📦 Found firmware files:"
          echo "$FIRMWARE_FILES"
          for file in $FIRMWARE_FILES; do
            echo "  📁 Copying $(basename "$file")"
            cp "$file" "../$RELEASE_FOLDER/"
          done
        else
          echo "⚠️ No firmware files (Kuno.LE.1.0_SDX35_*_qcap.zip) found"
        fi

        # Flash scripts -- one per NAND page-size variant, so testing a build on
        # real hardware is just "fastboot devices && ./flash_2k.sh" (or _4k),
        # no need to hand-type ~25 fastboot commands or remember the right
        # sysfs/recoveryfs partition image name for the board's page size.
        cat > "../$RELEASE_FOLDER/flash_2k.sh" <<'FLASHEOF'
        #!/bin/bash
        set -e
        fastboot flash ipa_fw fw_ipa_gsi_5.2_le_fusion.elf
        fastboot flash multi_oem multi_oem.mbn
        fastboot flash multi_qti multi_qti.mbn
        # fastboot flash sec sec.elf
        fastboot flash apdp apdp.mbn
        fastboot flash qupfw qupv3fw.elf
        fastboot flash abl abl.elf
        fastboot flash tz tz.mbn
        fastboot flash tz_devcfg devcfg.mbn
        fastboot flash cmnlib cmnlib.mbn
        fastboot flash sbl xbl_s_nand.melf
        fastboot flash xbl_config xbl_config.elf
        fastboot flash xbl_ramdump xbl_ramdump.elf
        fastboot flash uefi uefi.elf
        fastboot flash shrm shrm.elf
        fastboot flash aop aop.mbn
        fastboot flash aop_devcfg aop_devcfg.mbn
        fastboot flash cpucpfw cpucp.elf
        fastboot flash modem NON-HLOS.ubi
        fastboot flash boot boot.img
        fastboot flash system sysfs-2k.ubi
        fastboot flash recovery boot.img
        fastboot flash recoveryfs recoveryfs-2k.ubi
        fastboot flash keymaster km41_32.mbn
        fastboot erase misc
        FLASHEOF

        cat > "../$RELEASE_FOLDER/flash_4k.sh" <<'FLASHEOF'
        #!/bin/bash
        set -e
        fastboot flash ipa_fw fw_ipa_gsi_5.2_le_fusion.elf
        fastboot flash multi_oem multi_oem.mbn
        fastboot flash multi_qti multi_qti.mbn
        # fastboot flash sec sec.elf
        fastboot flash apdp apdp.mbn
        fastboot flash qupfw qupv3fw.elf
        fastboot flash abl abl.elf
        fastboot flash tz tz.mbn
        fastboot flash tz_devcfg devcfg.mbn
        fastboot flash cmnlib cmnlib.mbn
        fastboot flash sbl xbl_s_nand.melf
        fastboot flash xbl_config xbl_config.elf
        fastboot flash xbl_ramdump xbl_ramdump.elf
        fastboot flash uefi uefi.elf
        fastboot flash shrm shrm.elf
        fastboot flash aop aop.mbn
        fastboot flash aop_devcfg aop_devcfg.mbn
        fastboot flash cpucpfw cpucp.elf
        fastboot flash modem NON-HLOS.ubi
        fastboot flash boot boot.img
        fastboot flash system sysfs.ubi
        fastboot flash recovery boot.img
        fastboot flash recoveryfs recoveryfs.ubi
        fastboot flash keymaster km41_32.mbn
        fastboot erase misc
        FLASHEOF

        chmod +x "../$RELEASE_FOLDER/flash_2k.sh" "../$RELEASE_FOLDER/flash_4k.sh"
        echo "🔧 Added flash_2k.sh / flash_4k.sh to release package"

        # Go back to workspace root and verify release folder
        cd ..
        echo ""
        echo "📋 Release package contents:"
        echo "📁 Release folder: $RELEASE_FOLDER"
        ls -la "$RELEASE_FOLDER/"

        echo ""
        echo "📊 Release package summary:"
        echo "  📁 Folder: $RELEASE_FOLDER"
        echo "  📦 Total files: $(ls -1 "$RELEASE_FOLDER/" | wc -l)"
        echo "  💾 Total size: $(du -sh "$RELEASE_FOLDER" | cut -f1)"

        # Save release folder info
        echo "RELEASE_FOLDER=$RELEASE_FOLDER" >> $GITHUB_ENV
        echo "RELEASE_PATH=${{ env.WORKSPACE_ROOT }}/$RELEASE_FOLDER" >> $GITHUB_ENV

    # Step 12b: Hardware Test -- optional (inputs.run_hw_test). Talks to the
    # test rig ("pi", a Raspberry Pi with a 2K-NAND board on USB) over
    # Tailscale. This runner joined the tailnet once (userspace-networking
    # mode, relayed via DERP -- this sandbox can't do direct UDP P2P) and
    # ~/.ssh/config has a permanent ProxyCommand for Host "pi", so a plain
    # "ssh pi ..." just works as long as tailscaled is still alive. This
    # step self-heals that daemon if it isn't.
    - name: Ensure Tailscale Connectivity
      if: success() && inputs.run_hw_test
      timeout-minutes: 3
      run: |
        if ssh -o ConnectTimeout=8 -o BatchMode=yes pi 'echo ok' >/dev/null 2>&1; then
          echo "Tailscale link to test rig OK"
        else
          echo "SSH to test rig failed -- restarting tailscaled on this runner"
          sudo pkill -f tailscaled 2>/dev/null || true
          sleep 2
          sudo mkdir -p /var/lib/tailscale /run/tailscale
          sudo nohup tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --tun=userspace-networking --socks5-server=localhost:1055 --outbound-http-proxy-listen=localhost:1056 > /tmp/tailscaled.log 2>&1 &
          disown
          sleep 5
          sudo tailscale --socket=/run/tailscale/tailscaled.sock up --hostname=cicd-sdx-jammy-runner --accept-dns=false
          sleep 3
          ssh -o ConnectTimeout=10 -o BatchMode=yes pi 'echo ok' || { echo "Still cannot reach test rig -- failing hw test"; exit 1; }
          echo "Tailscale link recovered"
        fi

    # All test *logic* (NAND detection, flash, boot-check, pass/fail
    # criteria) lives in cqm22x-docs, not here -- testcases/cases/TC-023.adoc
    # documents it, automation/tc_023_fastboot_flash_boot_check.py implements
    # it. cqm22x-docs is a manifest project now (see
    # chipcode-cqm22x-3-qcom-refs.xml, pinned to main), so "Initialize Repo
    # Tool" already synced it to ${{ env.WORKSPACE_ROOT }}/cqm22x-docs
    # earlier in this job -- no separate clone needed here. Anyone can run
    # the exact same command locally against the rig (see
    # automation/README.adoc) -- CI doesn't do anything the docs repo
    # doesn't already let you do by hand.
    #
    # Board NAND page size (2K vs 4K) is auto-detected from the board itself
    # (fastboot's "logical-block-size": 0x800 = 2K, 0x1000 = 4K -- confirmed
    # against the real rig board, which reports 0x800 and matches the
    # "p2K_b128K" naming already used in the build's rawprogram/patch XML
    # files) rather than assumed, so this keeps working if a 4K board ever
    # joins the rig without needing a workflow edit. If the release build
    # doesn't actually contain a binaries_<variant>/ for whatever the board
    # turns out to be (right now only binaries_2k gets built), TC-023 fails
    # loudly instead of silently flashing the wrong image set.
    #
    # Every file transfer between this runner and the rig goes via Google
    # Drive (rclone, same GGDrive: remote config on both sides -- copied to
    # the rig once), not scp over the Tailscale link: this runner and the
    # rig both have plain internet, while the Tailscale hop is relayed
    # through DERP (no direct UDP path out of this sandbox) and scp over it
    # is slow even for small files (scp-over-DERP took ~4 minutes for the
    # ~130MB binaries archive alone). SSH itself is still used, but only for
    # the actual remote command invocation, never for moving file content.
    - name: Hardware Test (flash + boot check)
      if: success() && inputs.run_hw_test
      timeout-minutes: 20
      run: |
        cd "${{ env.RELEASE_PATH }}"
        BINARIES_TAR=$(find . -maxdepth 1 -name "Kuno.LEI.1.0_SDX35_*_binaries.tar.gz" -type f | head -1)
        if [ -z "$BINARIES_TAR" ]; then
          echo "No binaries archive in release package -- cannot hardware-test"
          echo "HW_TEST_RESULT=SKIPPED (no binaries archive)" >> $GITHUB_ENV
          exit 1
        fi
        TAR_BASENAME=$(basename "$BINARIES_TAR")
        RCLONE="rclone --config $HOME/rclone_fw_share.conf"
        DRIVE_RUN_PATH="share/khoa/hwtest-ci/run-${{ github.run_id }}"

        # Everything crosses the Tailscale link via Drive now, not scp --
        # this runner and the rig both have plain internet and rclone (with
        # the same GGDrive: remote config on both sides), while the
        # Tailscale hop is relayed through DERP (no direct UDP path out of
        # this sandbox) and scp over it is slow even for small files.
        echo "Uploading binaries + flash scripts + test automation to Drive ($DRIVE_RUN_PATH)..."
        # rclone copy takes exactly one source and one dest (not multiple
        # sources like cp) -- one call per file/dir.
        $RCLONE copy "$BINARIES_TAR" "GGDrive:/$DRIVE_RUN_PATH" --progress
        $RCLONE copy flash_2k.sh "GGDrive:/$DRIVE_RUN_PATH" --progress
        $RCLONE copy flash_4k.sh "GGDrive:/$DRIVE_RUN_PATH" --progress
        $RCLONE copy "${{ env.WORKSPACE_ROOT }}/cqm22x-docs" "GGDrive:/$DRIVE_RUN_PATH/docs" --progress

        # CI's whole job here is "download the build, run the master test
        # runner at basic level" -- run_tests.py (in cqm22x-docs) owns which
        # test cases that means and how each one is judged PASS/FAIL/ERROR;
        # nothing hardware-specific is duplicated in this workflow.
        echo "Running automation/run_tests.py --level basic on test rig (flock-serialized -- waits its turn if another job is using the board)..."
        set +e
        ssh pi "flock -w 1200 ~/hwtest/board.lock bash -s" > hw_test_output.log 2>&1 <<REMOTE_EOF
        set -e
        RCLONE="rclone --config \$HOME/rclone_fw_share.conf"
        rm -rf ~/hwtest_run
        mkdir -p ~/hwtest_run
        cd ~/hwtest_run
        \$RCLONE copy "GGDrive:/$DRIVE_RUN_PATH" .
        tar xzf "$TAR_BASENAME"
        # rclone/Drive doesn't preserve the executable bit (Drive isn't a
        # POSIX filesystem) -- restore it after download, unlike scp which
        # used to carry it over automatically.
        chmod +x flash_2k.sh flash_4k.sh
        # Capture run_tests.py's exit code instead of letting it FAIL under
        # set -e -- otherwise a failing test skips the evidence upload below
        # entirely, which is exactly the case debugging needs it most.
        set +e
        python3 docs/automation/run_tests.py --level basic --evidence-dir test_evidence
        TEST_EXIT=\$?
        set -e
        \$RCLONE copy test_evidence "GGDrive:/$DRIVE_RUN_PATH/test_evidence"
        exit \$TEST_EXIT
        REMOTE_EOF
        REMOTE_EXIT=$?
        set -e

        cat hw_test_output.log

        echo "Pulling test evidence back from Drive..."
        rm -rf "${{ env.WORKSPACE_ROOT }}/hw_test_evidence"
        if $RCLONE copy "GGDrive:/$DRIVE_RUN_PATH/test_evidence" "${{ env.WORKSPACE_ROOT }}/hw_test_evidence" --progress; then
          echo "Evidence pulled to ${{ env.WORKSPACE_ROOT }}/hw_test_evidence"
        else
          echo "Could not pull evidence dir (test run may have failed before it was written)"
        fi

        ssh pi "rm -rf ~/hwtest_run" || true
        # Best-effort cleanup -- don't fail the test over leftover Drive scratch files.
        $RCLONE purge "GGDrive:/$DRIVE_RUN_PATH" 2>&1 || true

        # run_tests.py's own exit code convention: 0 only if every selected
        # test PASSED, 1 otherwise (some test FAILED or ERRORed -- which one
        # and why is in hw_test_evidence/*.log and results.json, both
        # uploaded as an artifact next).
        if [ $REMOTE_EXIT -eq 0 ]; then
          echo "Hardware test level=basic PASSED"
          echo "HW_TEST_RESULT=PASS" >> $GITHUB_ENV
        else
          echo "Hardware test level=basic FAILED -- see log above / hw_test_evidence artifact"
          echo "HW_TEST_RESULT=FAIL" >> $GITHUB_ENV
          exit 1
        fi

    - name: Upload Test Evidence
      if: always() && inputs.run_hw_test
      id: upload_test_evidence
      uses: actions/upload-artifact@v4
      with:
        name: hw-test-evidence-${{ github.run_id }}
        path: ${{ env.WORKSPACE_ROOT }}/hw_test_evidence/
        if-no-files-found: ignore
        retention-days: 90

    # Step 12d: Create Test Package -- everything needed to run tests
    # locally against a board (testcases + automation scripts), plus, if
    # this run actually did a hardware test (inputs.run_hw_test), the real
    # evidence + a generated report from it. This is the *entire*
    # cqm22x-docs checkout (already synced by "Initialize Repo Tool" --
    # see the manifest), not a curated subset: run_tests.py/gen_report.py
    # need scripts/lib_testcases.py and testcases/cases/*.adoc alongside
    # automation/ to work at all, and shipping the whole repo means
    # whoever gets the release package can run the *exact* commands from
    # cqm22x-docs' automation/README.adoc, no adaptation needed.
    - name: Create Test Package
      if: success()
      run: |
        cd "${{ env.RELEASE_PATH }}"
        mkdir -p tests
        cp -r "${{ env.WORKSPACE_ROOT }}/cqm22x-docs/." tests/docs/
        rm -rf tests/docs/.git

        if [ -d "${{ env.WORKSPACE_ROOT }}/hw_test_evidence" ] && [ -n "$(ls -A "${{ env.WORKSPACE_ROOT }}/hw_test_evidence" 2>/dev/null)" ]; then
          cp -r "${{ env.WORKSPACE_ROOT }}/hw_test_evidence" tests/evidence
          echo "Generating report from this run's evidence..."
          python3 tests/docs/automation/gen_report.py --evidence-dir tests/evidence --out tests/report.adoc
        else
          echo "No hardware-test evidence from this run (run_hw_test was off, or the test step didn't reach evidence collection)." > tests/README.txt
          echo "" >> tests/README.txt
          echo "Everything needed to run the tests yourself is still here:" >> tests/README.txt
          echo "  cd tests/docs && python3 automation/run_tests.py --level basic" >> tests/README.txt
          echo "See tests/docs/automation/README.adoc for the full guide." >> tests/README.txt
        fi

        echo "Test package contents:"
        find tests -maxdepth 2

    # Step 13: Upload Release Package -- build-release always runs this
    # (publish_release=true); build-verify skips it (publish_release=false), so
    # one-off test builds never touch the shared Google Drive folder.
    - name: Upload Release Package to Google Drive
      if: success() && inputs.publish_release
      timeout-minutes: 30
      run: |
        echo "SANDBOX TEST: uploading to share/khoa/test (temporary, user will delete manually)"

        RCLONE_BIN=/usr/bin/rclone
        RCLONE_CONF=/home/user/share_data/rclone-cli/Cavli-Team.conf
        UPLOAD_FOLDER_NAME="share/khoa/test"

        cd ${{ env.WORKSPACE_ROOT }}

        echo "📤 Upload details:"
        echo "  🗂️ Current directory: ${PWD}"
        echo "  📁 Local folder: ${{ env.RELEASE_FOLDER }}"
        echo "  📁 Remote folder: Cavli-Team/$UPLOAD_FOLDER_NAME"

        echo "🔄 Starting upload to Google Drive..."
        if "$RCLONE_BIN" --config "$RCLONE_CONF" copy "${{ env.RELEASE_FOLDER }}" "GGDrive:/Cavli-Team/$UPLOAD_FOLDER_NAME" --progress; then
          echo "🎉 Release package upload completed successfully!"
          DRIVE_LINK=$("$RCLONE_BIN" --config "$RCLONE_CONF" link "GGDrive:/Cavli-Team/$UPLOAD_FOLDER_NAME")
          echo "🔗 $DRIVE_LINK"
          # Passed to the "Publish Build Summary" step below, which writes the
          # actual $GITHUB_STEP_SUMMARY block (kept together with the logs link
          # and timing chart there instead of split across two step summaries).
          echo "DRIVE_LINK=$DRIVE_LINK" >> "$GITHUB_ENV"
          echo "DRIVE_FOLDER=Cavli-Team/$UPLOAD_FOLDER_NAME" >> "$GITHUB_ENV"
        else
          echo "💥 Upload to Google Drive failed"
          exit 1
        fi

    # Step 14: Publish Build Summary -- one place to grab the download link, the
    # build log, and how long each module took, both right on the run page
    # (GITHUB_STEP_SUMMARY) and pushed to Slack. Runs even if an earlier step
    # failed, so the log link + timing are still there to debug a broken run;
    # the Drive/log lines only appear when that step actually produced
    # something (DRIVE_LINK/LOGS_ARTIFACT_ID would be unset otherwise). Slack
    # and the step summary share one pass over timing.log instead of two.
    - name: Publish Build Summary
      if: always()
      run: |
        STATUS="${{ job.status }}"
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        LOGS_ARTIFACT_ID="${{ steps.upload_logs.outputs.artifact-id }}"
        LOGS_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${LOGS_ARTIFACT_ID}"
        EVIDENCE_ARTIFACT_ID="${{ steps.upload_test_evidence.outputs.artifact-id }}"
        EVIDENCE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${EVIDENCE_ARTIFACT_ID}"
        TIMING_LOG="${{ env.CHIPCODE_ROOT }}/build_logs/timing.log"

        {
          echo "# Build Results"
          echo ""
          echo "Status: $STATUS"
          if [ -n "${{ env.CHERRY_PICK_SUMMARY }}" ]; then
            echo ""
            echo "Cherry-picked:"
            echo "${{ env.CHERRY_PICK_SUMMARY }}" | sed 's/^/- `/; s/ -> / onto **/; s/$/**/'
          fi
          if [ -n "${{ env.HW_TEST_RESULT }}" ]; then
            echo ""
            echo "Hardware test: ${{ env.HW_TEST_RESULT }}"
          fi
          echo ""
          echo "## Downloads"
          echo ""
          if [ -n "${{ env.DRIVE_LINK }}" ]; then
            echo "- Build package: [${{ env.DRIVE_FOLDER }}](${{ env.DRIVE_LINK }})"
          fi
          if [ -n "$LOGS_ARTIFACT_ID" ]; then
            echo "- Build logs (per-module logs + timing_chart.html): [download]($LOGS_URL)"
          fi
          if [ -n "$EVIDENCE_ARTIFACT_ID" ]; then
            echo "- Hardware test evidence (per-test logs + results.json): [download]($EVIDENCE_URL)"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        # Also builds SLACK_TIMING (plain "name: Ns" lines) alongside the step
        # summary's table -- process substitution (not a pipe) so the loop runs
        # in *this* shell and SLACK_TIMING survives past it, not a subshell.
        SLACK_TIMING=""
        TOTAL_DUR=""
        if [ -f "$TIMING_LOG" ]; then
          {
            echo "## Module Timing"
            echo ""
            echo "| Module | Duration | |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          MAXDUR=$(grep -v '\] TOTAL ' "$TIMING_LOG" | sed -n 's/.*duration=\([0-9]*\)s.*/\1/p' | sort -n | tail -1)
          [ -z "$MAXDUR" ] && MAXDUR=1

          while IFS= read -r LINE; do
            # recovery's line (written by the SPIN_CHAIN_CMD path, not log_task) has no
            # "start=+Ns" field -- match on the first space-run after the name instead of
            # requiring "start=" specifically, so recovery isn't silently dropped from the table.
            NAME=$(echo "$LINE" | sed -n 's/.*\] \([a-zA-Z_-]*\) .*/\1/p')
            DUR=$(echo "$LINE" | sed -n 's/.*duration=\([0-9]*\)s.*/\1/p')
            EXIT=$(echo "$LINE" | sed -n 's/.*exit=\([0-9-]*\).*/\1/p')
            [ -z "$NAME" ] && continue
            BARLEN=$(awk -v d="$DUR" -v m="$MAXDUR" 'BEGIN{n=int(d/m*30); if(n<1)n=1; print n}')
            BAR=$(printf '#%.0s' $(seq 1 "$BARLEN"))
            MARK=""; [ "$EXIT" != "0" ] && MARK=" (failed)"
            echo "| ${NAME}${MARK} | ${DUR}s | \`${BAR}\` |" >> "$GITHUB_STEP_SUMMARY"
            SLACK_TIMING="$SLACK_TIMING
        ${NAME}: ${DUR}s${MARK}"
          done < <(grep -v '\] TOTAL ' "$TIMING_LOG")

          TOTAL_DUR=$(grep '\] TOTAL ' "$TIMING_LOG" | sed -n 's/.*duration=\([0-9]*\)s.*/\1/p')
          if [ -n "$TOTAL_DUR" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Total internal build time:** ${TOTAL_DUR}s" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "No timing.log found (build_logs/ missing), skipping timing chart" >> "$GITHUB_STEP_SUMMARY"
        fi

        # ---- Slack -- always runs (success or failure), so a broken build gets
        # flagged just as loudly as a good one. No-ops quietly if the
        # SLACK_WEBHOOK_URL repo secret isn't set. job.status reflects every
        # step's outcome so far, which by this point (last step) is final. ----
        WEBHOOK="${{ secrets.SLACK_WEBHOOK_URL }}"
        if [ -z "$WEBHOOK" ]; then
          echo "SLACK_WEBHOOK_URL secret not set -- skipping Slack notification"
          exit 0
        fi

        TEXT="*${{ github.workflow }}* -- $STATUS"
        TEXT="$TEXT
        <$RUN_URL|View run> -- triggered by ${{ github.actor }}"
        if [ -n "${{ env.CHERRY_PICK_SUMMARY }}" ]; then
          CP=$(echo "${{ env.CHERRY_PICK_SUMMARY }}" | tr '\n' ';' | sed 's/;$//; s/;/, /g')
          TEXT="$TEXT
        Cherry-picked: $CP"
        fi
        if [ -n "${{ env.HW_TEST_RESULT }}" ]; then
          TEXT="$TEXT
        Hardware test: ${{ env.HW_TEST_RESULT }}"
        fi
        if [ -n "${{ env.DRIVE_LINK }}" ]; then
          TEXT="$TEXT
        Download build: <${{ env.DRIVE_LINK }}|release package>"
        fi
        if [ -n "$LOGS_ARTIFACT_ID" ]; then
          TEXT="$TEXT
        Build log: <$LOGS_URL|download>"
        fi
        if [ -n "$EVIDENCE_ARTIFACT_ID" ]; then
          TEXT="$TEXT
        Test evidence: <$EVIDENCE_URL|download>"
        fi
        if [ -n "$SLACK_TIMING" ]; then
          TEXT="$TEXT
        Module timing:$SLACK_TIMING"
          [ -n "$TOTAL_DUR" ] && TEXT="$TEXT
        Total: ${TOTAL_DUR}s"
        fi

        # python3 for JSON-encoding, not manual quoting -- TEXT has embedded
        # newlines/quotes (run title, commit messages via CHERRY_PICK_SUMMARY)
        # that would otherwise be easy to get wrong.
        PAYLOAD=$(python3 -c "import json,sys; print(json.dumps({'text': sys.argv[1]}))" "$TEXT")
        HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$WEBHOOK")
        if [ "$HTTP_CODE" = "200" ]; then
          echo "Slack notification sent"
        else
          echo "Slack notification failed (HTTP $HTTP_CODE) -- not failing the build over this"
        fi
